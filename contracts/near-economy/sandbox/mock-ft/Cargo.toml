[package]
name = "sandbox-mock-ft"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy"] }
near-contract-standards = "=5.17.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true
